<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3eb" />
    <meta name="description" content="Church service management, worship songs, lyrics, and projector presentations for Indian Church of Christ, South Sector." />
    <title>INCOC South</title>
    <link rel="icon" href="/incoc-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("incoc-south-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch {
        // Theme preference is optional.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
